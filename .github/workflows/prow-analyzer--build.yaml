name: Build and Test

on:
  push:
    branches: [main]
    paths: &prow-analyzer--path
      - 'apps/prow-analyzer/**'
      - 'image/container/prow-analyzer/**'
      - '.github/workflows/prow-analyzer--build.yaml'
  pull_request:
    branches: [main]
    paths: *prow-analyzer--path

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version: '1.22'
    
    # Use the shared local/CI build and test entry points.
    - name: Build binaries
      working-directory: ./apps/prow-analyzer
      run: make build

    - name: Unit Tests with Coverage
      working-directory: ./apps/prow-analyzer
      run: make test--unit

    - name: Integration Tests
      working-directory: ./apps/prow-analyzer
      run: make test--integration

  container--build-and-push:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Log in to Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: images.paas.redhat.com
        username: ${{ secrets.QUAY____RHT__ITUP____IENG__APP__PROW_ANALYZER____USR }}
        password: ${{ secrets.QUAY____RHT__ITUP____IENG__APP__PROW_ANALYZER____PWD }}

    - name: Build and Push Container Image
      uses: docker/build-push-action@v6
      with:
        context: apps/prow-analyzer
        file: image/container/prow-analyzer/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: images.paas.redhat.com/ieng/app/prow-analyzer:latest
