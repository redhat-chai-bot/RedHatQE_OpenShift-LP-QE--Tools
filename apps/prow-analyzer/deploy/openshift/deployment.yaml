apiVersion: v1
kind: Namespace
metadata:
  name: prow-analyzer
---
# NOTE: prow-analyzer-secrets is intentionally omitted here and created
# out-of-band before `oc apply`. See doc/deployment.md, Steps 2 and 4, for why.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prow-analyzer-config
  namespace: prow-analyzer
data:
  monitored-channels: "C12345678,C87654321"  # Replace with actual channel IDs
  mcp-url: "https://<ship-help-mcp-host>/personas/<persona>/mcp"  # Replace with your ship-help MCP endpoint
  prompt-template: "Analyze this Prow CI failure in detail. Provide: (1) Root cause, (2) Related Jira issues, (3) Recurring pattern analysis, (4) Recommended actions. URL: {job_url}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prow-analyzer-bot
  namespace: prow-analyzer
  labels:
    app: prow-analyzer-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prow-analyzer-bot
  template:
    metadata:
      labels:
        app: prow-analyzer-bot
    spec:
      containers:
      - name: bot
        # Replace with the image you built and pushed in Step 1
        # (Makefile default: images.paas.redhat.com/ieng/app/prow-analyzer:latest).
        image: images.paas.redhat.com/ieng/app/prow-analyzer:latest
        command: ["/usr/bin/prow-analyzer--bot"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: PROW_AN__MCP__URL__SHIP_HELP
          valueFrom:
            configMapKeyRef:
              name: prow-analyzer-config
              key: mcp-url
        - name: PROW_AN__MCP__TOKEN__SHIP_HELP
          valueFrom:
            secretKeyRef:
              name: prow-analyzer-secrets
              key: ship-help-token
        - name: PROW_AN__SLACK__BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: prow-analyzer-secrets
              key: slack-bot-token
        - name: PROW_AN__SLACK__APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: prow-analyzer-secrets
              key: slack-app-token
        - name: PROW_AN__MONITORED_CHANNELS
          valueFrom:
            configMapKeyRef:
              name: prow-analyzer-config
              key: monitored-channels
        # Fail-closed by default: with an empty PROW_AN__MONITORED_CHANNELS the bot monitors
        # nothing unless PROW_AN__MONITOR__ALL is set to "true" (monitors every joined channel).
        - name: PROW_AN__MONITOR__ALL
          value: "false"
        - name: PROW_AN__PROMPT__TEMPLATE
          valueFrom:
            configMapKeyRef:
              name: prow-analyzer-config
              key: prompt-template
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f /usr/bin/prow-analyzer--bot
          initialDelaySeconds: 30
          periodSeconds: 30
