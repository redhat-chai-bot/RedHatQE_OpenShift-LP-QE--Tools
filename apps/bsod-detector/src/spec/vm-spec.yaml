apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${VM_NAME}
  namespace: ${NAMESPACE}
  labels:
    kubevirt.io/vm: ${VM_NAME}
spec:
  runStrategy: Manual
  dataVolumeTemplates:
    - metadata:
        name: ${VM_NAME}-root-disk
        annotations:
          descheduler.alpha.kubernetes.io/evict: "true"
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: ${STORAGE_SIZE}
          storageClassName: ${STORAGE_CLASS}
          volumeMode: Block
        source:
          pvc:
            name: ${SOURCE_DV}
            namespace: ${NAMESPACE}
  template:
    metadata:
      labels:
        kubevirt.io/vm: ${VM_NAME}
    spec:
      architecture: amd64
      domain:
        clock:
          timer:
            hpet:
              present: false
            hyperv: {}
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
          utc: {}
        cpu:
          cores: 8
          sockets: 1
          threads: 1
        devices:
          autoattachSerialConsole: true
          blockMultiQueue: true
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: ${VM_NAME}-root-disk
            - disk:
                bus: virtio
              name: cloudinitdisk
          inputs:
            - bus: virtio
              name: tablet
              type: tablet
          interfaces:
            - masquerade: {}
              model: virtio
              name: nic-0
          networkInterfaceMultiqueue: true
          tpm: {}
        features:
          acpi: {}
          apic: {}
          hyperv:
            frequencies: {}
            ipi: {}
            reenlightenment: {}
            relaxed: {}
            reset: {}
            runtime: {}
            spinlocks:
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            vapic: {}
            vpindex: {}
          smm: {}
        firmware:
          bootloader:
            efi:
              secureBoot: true
        machine:
          type: q35
        resources:
          limits:
            cpu: "8"
            memory: 16G
          requests:
            cpu: "8"
            memory: 16G
      evictionStrategy: LiveMigrate
      networks:
        - name: nic-0
          pod: {}
      volumes:
        - dataVolume:
            name: ${VM_NAME}-root-disk
          name: ${VM_NAME}-root-disk
        - cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - powershell -Command "reg add 'HKLM\SYSTEM\CurrentControlSet\Control\CrashControl' /v AutoReboot /t REG_DWORD /d 0 /f"
                - powershell -Command "Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\ServerManager' -Name 'DoNotOpenServerManagerAtLogon' -Value 1 -Type DWord -Force; Set-SConfig -AutoLaunch \$false"
          name: cloudinitdisk
