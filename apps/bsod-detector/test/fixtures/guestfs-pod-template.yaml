apiVersion: v1
kind: Pod
metadata:
  labels:
    app: bsod--guest-fs--extraction
  name: guest-fs--ntfs
  namespace: ''
spec:
  automountServiceAccountToken: false
  containers:
    - name: libguestfs
      image: ''
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
      args:
        - exec tail -f /dev/null
      workingDir: /tmp/guestfs
      env:
        - name: LIBGUESTFS_BACKEND
          value: direct
        - name: LIBGUESTFS_BACKEND_SETTINGS
          value: force_kvm
        - name: LIBGUESTFS_TMPDIR
          value: /tmp/guestfs
        - name: LIBGUESTFS_CACHEDIR
          value: /tmp/guestfs
        - name: HOME
          value: /home/guestfs
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          memory: 2Gi
          devices.kubevirt.io/kvm: "1"
        limits:
          memory: 4Gi
          devices.kubevirt.io/kvm: "1"
      volumeDevices:
        - name: vm-disk
          devicePath: /dev/vda
      volumeMounts:
        - name: guest-fs--tmp
          mountPath: /tmp/guestfs
        - name: guest-fs--home
          mountPath: /home/guestfs
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: vm-disk
      persistentVolumeClaim:
        claimName: ''
        readOnly: true
    - name: guest-fs--tmp
      emptyDir: {}
    - name: guest-fs--home
      emptyDir: {}
